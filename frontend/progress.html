<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your progress · Dermalis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Design tokens: kept in step with index.html. */
    :root {
      --sage-100: #E6EEE3;
      --sage-300: #B5C9B1;
      --sage-500: #7A9E7E;
      --sage-700: #4F6B53;
      --terracotta-300: #E9B4A2;
      --terracotta-500: #C8664B;
      --terracotta-700: #9A4A35;
      --mustard-300: #EFD58F;
      --mustard-500: #D9A441;
      --navy-500: #3E5170;
      --navy-700: #2B3A55;
      --paper: #F6EFE3;
      --paper-light: #FBF7F0;
      --clay: #E8D9C4;
      --ink: #2A2620;
      --ink-muted: #6E655A;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Nunito", -apple-system, "Segoe UI", sans-serif;
      --font-hand: "Caveat", "Comic Sans MS", cursive;
      --radius-paper: 18px 24px 16px 22px / 22px 16px 24px 18px;
      --shadow-paper: 3px 4px 0 rgba(42, 38, 32, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.55;
    }
    h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em; color: var(--navy-700); }
    h2 { margin: 0 0 10px; font-size: 19px; }
    .muted { color: var(--ink-muted); font-size: 13px; }

    header, main { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
    header { padding-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 30px; line-height: 1; }
    header .tagline { font-family: var(--font-hand); font-size: 20px; color: var(--terracotta-500); }
    main { padding-top: 16px; padding-bottom: 64px; display: grid; gap: 22px; }

    .panel {
      background: var(--paper-light);
      border: 2px solid var(--ink);
      border-radius: var(--radius-paper);
      box-shadow: var(--shadow-paper);
      padding: 20px;
      min-width: 0;
    }
    .row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; }

    button, a.link-btn {
      font: inherit;
      font-weight: 700;
      border: 2px solid var(--ink);
      border-radius: 14px 18px 14px 16px;
      padding: 9px 16px;
      background: var(--terracotta-500);
      color: var(--paper-light);
      cursor: pointer;
      box-shadow: 2px 3px 0 var(--ink);
      text-decoration: none;
      display: inline-block;
    }
    button:hover:not(:disabled) { background: var(--terracotta-700); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary, a.link-btn { background: var(--paper-light); color: var(--navy-700); }
    button.secondary:hover:not(:disabled), a.link-btn:hover { background: var(--clay); }
    button.small { padding: 4px 10px; font-size: 13px; box-shadow: 1px 2px 0 var(--ink); }

    /* Start date + week */
    .week-badge {
      display: inline-grid; place-items: center;
      min-width: 92px; padding: 8px 14px;
      background: var(--mustard-300); border: 2px solid var(--ink);
      border-radius: 50% 46% 52% 48%; transform: rotate(-3deg);
      font-family: var(--font-display); font-weight: 700; color: var(--navy-700); text-align: center; line-height: 1.1;
    }
    .week-badge small { font-family: var(--font-body); font-weight: 600; font-size: 12px; color: var(--ink-muted); }
    .start { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .start label { font-weight: 700; display: block; font-size: 13px; }
    input[type=date], input[type=text] {
      font: inherit; padding: 7px 10px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; max-width: 100%;
    }

    /* Around now */
    .now-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .now-list li { padding: 10px 12px; border-radius: 12px; background: var(--sage-100); border: 2px solid var(--sage-300); }
    .now-list li.next { background: #fff; border-style: dashed; }
    .now-list b { color: var(--navy-700); }

    /* Timeline (bars positioned by percent, so it scales to any width) */
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-muted); margin: 0 0 12px; }
    .legend i { display: inline-block; width: 22px; height: 10px; border-radius: 5px; vertical-align: middle; margin-right: 6px; border: 1.5px solid var(--ink); }
    .tl { position: relative; }
    .tl-row { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px; align-items: center; padding: 10px 0; border-top: 1px dotted var(--sage-300); }
    .tl-name { font-weight: 700; font-size: 14px; line-height: 1.3; }
    .tl-name .ing { display: block; font-weight: 600; font-size: 12px; color: var(--terracotta-700); }
    .tl-look { grid-column: 2; font-size: 13px; color: var(--ink-muted); margin-top: -4px; }
    .track { position: relative; height: 22px; background: var(--paper); border-radius: 11px; }
    .bar { position: absolute; top: 3px; bottom: 3px; border-radius: 8px; border: 1.5px solid var(--ink); }
    .bar.first { background: var(--terracotta-300); }
    .bar.full { background: var(--terracotta-500); }
    .kind-supportive .bar.first { background: var(--sage-100); }
    .kind-supportive .bar.full { background: var(--sage-300); }
    .kind-protective .bar { background: repeating-linear-gradient(45deg, var(--mustard-300) 0 6px, var(--paper-light) 6px 12px); border-style: dashed; }
    .axis { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px; }
    .axis-track { position: relative; height: 34px; }
    .tick { position: absolute; top: 4px; transform: translateX(-50%); font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
    .dot { position: absolute; top: 20px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--navy-500); border: 2px solid var(--paper-light); }
    .today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2.5px solid var(--navy-700); pointer-events: none; z-index: 2; }
    .today span {
      position: absolute; top: -2px; left: 4px; font-family: var(--font-hand); font-size: 18px; color: var(--navy-700);
      background: var(--paper-light); padding: 0 3px; white-space: nowrap;
    }
    .tl-lines { position: absolute; top: 0; bottom: 0; left: 214px; right: 0; pointer-events: none; }

    /* Photos */
    .upload { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 16px; }
    .upload .field { display: grid; gap: 3px; font-size: 13px; font-weight: 700; }
    #photo-input { display: none; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .shot { margin: 0; background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 6px 8px; box-shadow: var(--shadow-paper); }
    .shot img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; display: block; background: var(--clay); }
    .shot figcaption { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; }
    .shot .wk { font-family: var(--font-hand); font-size: 20px; color: var(--terracotta-700); line-height: 1; }
    .shot .note { display: block; font-size: 12px; color: var(--ink-muted); }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
    .compare figure { margin: 0; }
    .compare img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; border: 2px solid var(--ink); background: var(--clay); }
    .compare select { font: inherit; width: 100%; margin-bottom: 6px; padding: 6px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; }
    .empty { padding: 18px; text-align: center; border: 2px dashed var(--sage-500); border-radius: var(--radius-paper); background: var(--sage-100); color: var(--sage-700); }
    .empty .hand { font-family: var(--font-hand); font-size: 22px; display: block; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 10;
      background: var(--navy-700); color: var(--paper-light); padding: 10px 16px; border-radius: 12px; box-shadow: 3px 4px 0 var(--ink);
      max-width: calc(100vw - 32px);
    }
    .toast[hidden] { display: none; }

    @media (max-width: 760px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      .row { grid-template-columns: 1fr; }
      .tl-row, .axis { grid-template-columns: 1fr; gap: 6px; }
      .axis > :first-child { display: none; }
      .tl-look { grid-column: 1; }
      .tl-lines { left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .week-badge { transform: none; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Your progress</h1>
      <span class="tagline">small changes add up</span>
    </div>
    <a class="link-btn" href="./">← Back to Dermalis</a>
  </header>

  <main id="main">
    <p class="muted" id="loading">Loading your routine…</p>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="progress.js"></script>
</body>
</html>
